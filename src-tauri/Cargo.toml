[package]
name = "cobalto"
version = "0.1.0"
description = "Cobalto — client di posta leggero con AI integrata"
edition = "2021"
rust-version = "1.88"

[lib]
name = "cobalto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "fs"] }
futures = "0.3"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.11"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "pool", "tokio1", "tokio1-native-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream", "charset", "http2"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.11.1"
tauri-plugin-notification = "2"

# Binario il più piccolo possibile
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
